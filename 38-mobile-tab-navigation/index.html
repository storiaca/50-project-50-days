<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Tab Navigation</title>
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="phone">
      <img src="images/fulvio.jpg" alt="Basket" class="content show">
      <img src="images/beach-pexel.jpg" alt="Beach" class="content">
      <img src="images/space.jpeg" alt="Space" class="content">
      <img src="images/wordpress.png" alt="Wordpress" class="content">
      <nav>
        <ul>
          <li>
            <i class="fa fa-home"></i>
            <p>Home</p>
          </li>
          <li>
            <i class="fa fa-box"></i>
            <p>Work</p>
          </li>
          <li>
            <i class="fa fa-book-open"></i>
            <p>Blog</p>
          </li>
          <li>
            <i class="fas fa-users"></i>
            <p>About Us</p>
          </li>
        </ul>
      </nav>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
